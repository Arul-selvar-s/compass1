name: Database upgrade test (old app -> new app keeps your data)

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/com/compass/diary/data/local/**'
      - '.github/workflows/migration-test.yml'
      - 'scripts/migration-e2e.sh'

defaults:
  run:
    shell: bash

permissions:
  contents: write

env:
  # Last commit before database version 8. When you add a newer migration, point this at the commit before it.
  OLD_COMMIT: 77619fa59d36e89494fd2690c31f28c4a721708d

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build a genuine version-7 database (from the OLD app's own Room schema)
        run: |
          git checkout -q "$OLD_COMMIT"
          gradle kspDebugKotlin --no-daemon --stacktrace 2>&1 | tee old-build.log
          IMPL=$(find app/build -name 'AppDatabase_Impl.*' | head -1)
          echo "old Room schema: $IMPL"
          cp "$IMPL" /tmp/AppDatabase_Impl.old
          git checkout -q "$GITHUB_SHA"
          git clean -fdxq -e old-build.log
          python3 scripts/make_v7_db.py /tmp/AppDatabase_Impl.old /tmp/v7.db | tee v7-db.log

      - name: Build the NEW app + its test APK (database v8)
        run: |
          gradle assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee new-build.log
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/new.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/new-test.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade old -> new on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/migration-e2e.sh

      - name: Publish report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-report.sh migration migration-out old-build.log new-build.log v7-db.log
